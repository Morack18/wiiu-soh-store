name: Publish Wii U SoH App Store repository

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily. Also supports manual execution from the Actions tab.
    - cron: '12 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install image processing dependency
        run: python3 -m pip install Pillow==11.3.0
      - name: Run package tests
        run: python3 -m unittest discover -s tests -v
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build custom homebrew package repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_repo.py --out public --compat 9.2.3
      - name: Upload static repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
